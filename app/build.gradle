plugins { id 'com.android.application' }
android {
 namespace 'com.vanigam.clothing'
 compileSdk 35
 defaultConfig {
  applicationId 'com.vanigam.clothing'; minSdk 26; targetSdk 34
  versionCode (project.findProperty('appVersionCode') ?: '2').toInteger()
  versionName project.findProperty('appVersionName') ?: '1.1.0'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs {
  release {
   if (System.getenv('SIGNING_KEYSTORE')) {
    storeFile file(System.getenv('SIGNING_KEYSTORE'))
    storePassword System.getenv('SIGNING_STORE_PASSWORD')
    keyAlias System.getenv('SIGNING_ALIAS')
    keyPassword System.getenv('SIGNING_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { minifyEnabled false; if (System.getenv('SIGNING_KEYSTORE')) signingConfig signingConfigs.release } }
}
